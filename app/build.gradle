plugins { id 'com.android.application' }
android {
 namespace 'com.pickq'
 compileSdk 34
 defaultConfig {
  applicationId 'com.pickq'; minSdk 26; targetSdk 34
  versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
  versionName System.getenv('VERSION_NAME') ?: '0.1.0'
  buildConfigField 'String', 'UPDATE_REPO', '"' + (System.getenv('UPDATE_REPO') ?: '') + '"'
 }
 buildFeatures { buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs { release {
  if (System.getenv('KEYSTORE_FILE')) {
   storeFile file(System.getenv('KEYSTORE_FILE')); storePassword System.getenv('KEYSTORE_PASSWORD')
   keyAlias System.getenv('KEY_ALIAS'); keyPassword System.getenv('KEY_PASSWORD')
  }
 } }
 buildTypes { release { if (System.getenv('KEYSTORE_FILE')) signingConfig signingConfigs.release } }
}

dependencies { implementation "net.sourceforge.jexcelapi:jxl:2.6.12" }

android {
 testOptions {
  unitTests.includeAndroidResources = true
  unitTests.all {
   systemProperty 'sun.net.client.defaultReadTimeout', '60000'
   systemProperty 'sun.net.client.defaultConnectTimeout', '15000'
   systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
   jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED', '--add-opens=java.base/java.util=ALL-UNNAMED', '--add-opens=java.base/java.io=ALL-UNNAMED'
  }
 }
}
dependencies {
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.14.1'
}
