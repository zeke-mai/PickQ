name: Android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Test Excel importer
        run: |
          mkdir -p /tmp/pickq-tests
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/net/sourceforge/jexcelapi/jxl/2.6.12/jxl-2.6.12.jar -o /tmp/jxl.jar
          javac -encoding UTF-8 -cp /tmp/jxl.jar -d /tmp/pickq-tests app/src/main/java/com/pickq/Xlsx.java app/src/main/java/com/pickq/ExcelImporter.java tests/ImportTest.java tests/LegacyImportTest.java app/src/main/java/com/pickq/SwipePhysics.java tests/SwipePhysicsTest.java app/src/main/java/com/pickq/ImportReview.java tests/ImportReviewTest.java tests/ImportReaderTest.java
          java -cp /tmp/pickq-tests:/tmp/jxl.jar com.pickq.ImportTest
          java -cp /tmp/pickq-tests:/tmp/jxl.jar com.pickq.LegacyImportTest
          java -cp /tmp/pickq-tests com.pickq.SwipePhysicsTest
          java -cp /tmp/pickq-tests:/tmp/jxl.jar com.pickq.ImportReviewTest
          java -cp /tmp/pickq-tests:/tmp/jxl.jar com.pickq.ImportReaderTest
      - name: Prepare stable signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure release signing secrets before tagging'; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build and lint
        env:
          UPDATE_REPO: ${{ github.repository }}
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION_NAME="${GITHUB_REF_NAME#v}"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            ./gradlew testDebugUnitTest assembleRelease lintRelease
          else
            ./gradlew testDebugUnitTest assembleDebug lintDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: PickQ-apk
          path: app/build/outputs/apk/**/*.apk
      - name: Publish APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/*.apk --generate-notes
